name: generate-and-upload-card

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github stats card
        uses: LuciNyan/pixel-profile/action@main
        with:
          # MUST be passed explicitly: action defaults to ${{ github.token }},
          # which GitHub restricted from reading the stargazers field in 2026-07.
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            dist/github-stats?username=ZH970&screen_effect=false&theme=fuji&dithering=true&hide=rank
            dist/github-stats-dark?username=ZH970&theme=fuji&hide=rank&avatar_border=false&screen_effect=true
            dist/github-stats-crt?username=ZH970&theme=crt&dithering=true&hide=rank&screen_effect=false
            dist/github-stats-lax?username=ZH970&theme=lax&dithering=true&hide=rank&screen_effect=false
            dist/github-stats-journey?username=ZH970&theme=journey&dithering=true&hide=rank&screen_effect=false
        env:
          # action reads process.env.GITHUB_TOKEN FIRST, before core.getInput().
          # Override it too so the explicit github_token actually takes effect.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}